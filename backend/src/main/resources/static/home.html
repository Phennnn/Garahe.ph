<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garahe.ph - Smart Parking Solution</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --electric-blue: #0052cc;
        --electric-blue-dark: #003d99;
        --electric-blue-light: #0065ff;
        --traffic-green: #36b37e;
        --soft-gray: #f4f5f7;
        --medium-gray: #dfe1e6;
        --text-dark: #172b4d;
        --text-light: #5e6c84;
        --white: #ffffff;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(
          135deg,
          var(--electric-blue) 0%,
          var(--electric-blue-light) 100%
        );
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        position: relative;
        overflow: hidden;
      }

      /* Animated Background Elements */
      .bg-circles {
        position: absolute;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 0;
      }

      .circle {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        animation: float 20s infinite;
      }

      .circle:nth-child(1) {
        width: 300px;
        height: 300px;
        top: -150px;
        left: -100px;
        animation-delay: 0s;
      }

      .circle:nth-child(2) {
        width: 200px;
        height: 200px;
        bottom: -100px;
        right: -50px;
        animation-delay: 4s;
      }

      .circle:nth-child(3) {
        width: 150px;
        height: 150px;
        top: 50%;
        right: 10%;
        animation-delay: 2s;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-30px) rotate(180deg);
        }
      }

      /* Main Container */
      .container {
        background: var(--white);
        border-radius: 30px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 1100px;
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        overflow: hidden;
        position: relative;
        z-index: 1;
        animation: slideUp 0.8s ease-out;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(50px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Left Side - Branding */
      .brand-side {
        background: linear-gradient(
          135deg,
          var(--electric-blue) 0%,
          var(--electric-blue-light) 100%
        );
        padding: 4rem 3rem;
        color: var(--white);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      .brand-side::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.1) 0%,
          transparent 70%
        );
        animation: rotate 20s linear infinite;
      }

      @keyframes rotate {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .brand-content {
        position: relative;
        z-index: 1;
      }

      .logo-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        margin-bottom: 2rem;
      }

      .logo-img {
        height: 80px;
        width: auto;
        filter: brightness(0) invert(1);
        animation: fadeIn 1s ease-out 0.3s both;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.8);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .brand-title {
        font-size: 3rem;
        font-weight: 800;
        margin-bottom: 1rem;
        animation: fadeIn 1s ease-out 0.4s both;
      }

      .brand-subtitle {
        font-size: 1.25rem;
        opacity: 0.95;
        margin-bottom: 2rem;
        animation: fadeIn 1s ease-out 0.5s both;
      }

      .features-list {
        text-align: left;
        animation: fadeIn 1s ease-out 0.6s both;
      }

      .feature-item {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1rem;
        font-size: 1rem;
        opacity: 0.9;
      }

      .feature-icon {
        font-size: 1.5rem;
      }

      /* Right Side - Login Form */
      .form-side {
        padding: 4rem 3rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .form-header {
        margin-bottom: 2rem;
      }

      .form-header h2 {
        font-size: 2rem;
        font-weight: 700;
        color: var(--text-dark);
        margin-bottom: 0.5rem;
      }

      .form-header p {
        color: var(--text-light);
      }

      /* Tab Switcher */
      .tab-switcher {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 2rem;
        background: var(--soft-gray);
        padding: 0.5rem;
        border-radius: 50px;
      }

      .tab-btn {
        flex: 1;
        padding: 0.875rem;
        border: none;
        background: transparent;
        border-radius: 50px;
        font-family: "Poppins", sans-serif;
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--text-light);
        cursor: pointer;
        transition: all 0.3s;
      }

      .tab-btn.active {
        background: var(--white);
        color: var(--electric-blue);
        box-shadow: 0 2px 8px rgba(0, 82, 204, 0.2);
      }

      .tab-btn:hover:not(.active) {
        color: var(--text-dark);
      }

      /* Form Content */
      .tab-content {
        display: none;
        animation: fadeInForm 0.4s ease-out;
      }

      .tab-content.active {
        display: block;
      }

      @keyframes fadeInForm {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        color: var(--text-dark);
        font-weight: 500;
        font-size: 0.9rem;
      }

      .form-input {
        width: 100%;
        padding: 1rem;
        border: 2px solid var(--medium-gray);
        border-radius: 12px;
        font-size: 1rem;
        font-family: "Poppins", sans-serif;
        transition: all 0.3s;
        background: var(--white);
      }

      .form-input:focus {
        outline: none;
        border-color: var(--electric-blue);
        box-shadow: 0 0 0 4px rgba(0, 82, 204, 0.1);
      }

      .form-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        font-size: 0.875rem;
      }

      .checkbox-label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--text-light);
        cursor: pointer;
      }

      .checkbox-label input {
        cursor: pointer;
      }

      .forgot-link {
        color: var(--electric-blue);
        text-decoration: none;
        font-weight: 500;
        transition: color 0.3s;
      }

      .forgot-link:hover {
        color: var(--electric-blue-dark);
      }

      .submit-btn {
        width: 100%;
        padding: 1.125rem;
        background: linear-gradient(
          135deg,
          var(--electric-blue) 0%,
          var(--electric-blue-light) 100%
        );
        color: var(--white);
        border: none;
        border-radius: 50px;
        font-size: 1rem;
        font-weight: 700;
        font-family: "Poppins", sans-serif;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 4px 16px rgba(0, 82, 204, 0.3);
        position: relative;
        overflow: hidden;
      }

      .submit-btn::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        transform: translate(-50%, -50%);
        transition:
          width 0.6s,
          height 0.6s;
      }

      .submit-btn:hover::before {
        width: 300px;
        height: 300px;
      }

      .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0, 82, 204, 0.4);
      }

      .submit-btn:active {
        transform: translateY(0);
      }

      .divider {
        text-align: center;
        margin: 2rem 0;
        position: relative;
      }

      .divider::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        height: 1px;
        background: var(--medium-gray);
      }

      .divider span {
        background: var(--white);
        padding: 0 1rem;
        color: var(--text-light);
        font-size: 0.875rem;
        position: relative;
      }

      .guest-btn {
        width: 100%;
        padding: 1.125rem;
        background: var(--white);
        color: var(--electric-blue);
        border: 2px solid var(--electric-blue);
        border-radius: 50px;
        font-size: 1rem;
        font-weight: 700;
        font-family: "Poppins", sans-serif;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }

      .guest-btn:hover {
        background: var(--electric-blue);
        color: var(--white);
        transform: translateY(-2px);
        box-shadow: 0 4px 16px rgba(0, 82, 204, 0.2);
      }

      .signup-prompt {
        text-align: center;
        margin-top: 1.5rem;
        color: var(--text-light);
        font-size: 0.9rem;
      }

      .signup-link {
        color: var(--electric-blue);
        font-weight: 600;
        text-decoration: none;
        transition: color 0.3s;
      }

      .signup-link:hover {
        color: var(--electric-blue-dark);
      }

      /* Success Message */
      .success-message {
        background: rgba(54, 179, 126, 0.1);
        border: 2px solid var(--traffic-green);
        color: var(--traffic-green);
        padding: 1rem;
        border-radius: 12px;
        margin-bottom: 1rem;
        font-weight: 500;
        display: none;
      }

      .success-message.show {
        display: block;
        animation: fadeInForm 0.4s ease-out;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .container {
          grid-template-columns: 1fr;
          max-width: 450px;
        }

        .brand-side {
          padding: 3rem 2rem;
        }

        .brand-title {
          font-size: 2rem;
        }

        .brand-subtitle {
          font-size: 1rem;
        }

        .form-side {
          padding: 2.5rem 2rem;
        }

        .features-list {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-circles">
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
    </div>

    <div class="container">
      <!-- Left Side - Branding -->
      <div class="brand-side">
        <div class="brand-content">
          <div class="logo-container">
            <img src="logo.png" alt="Garahe.ph Logo" class="logo-img" />
            <h1 class="brand-title">Garahe.ph</h1>
          </div>
          <p class="brand-subtitle">Your trusty parking companion</p>
          <div class="features-list">
            <div class="feature-item">
              <span class="feature-icon">✓</span>
              <span>Reserve parking spots in advance</span>
            </div>
            <div class="feature-item">
              <span class="feature-icon">✓</span>
              <span>Parking locations around Metro Manila</span>
            </div>
            <div class="feature-item">
              <span class="feature-icon">✓</span>
              <span>Real-time availability updates</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Side - Login Form -->
      <div class="form-side">
        <div class="form-header">
          <h2>Welcome Back!</h2>
          <p>Sign in to find your perfect parking spot</p>
        </div>

        <!-- Tab Switcher -->
        <div class="tab-switcher">
          <button class="tab-btn active" onclick="switchTab('login')">
            Login
          </button>
          <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- Login Tab -->
        <div class="tab-content active" id="loginTab">
          <div class="success-message" id="successMessage">
            Account created successfully! Please log in.
          </div>

          <form onsubmit="handleLogin(event)">
            <div class="form-group">
              <label for="loginEmail">Email Address</label>
              <input
                type="email"
                id="loginEmail"
                class="form-input"
                placeholder="you@example.com"
                required
              />
            </div>

            <div class="form-group">
              <label for="loginPassword">Password</label>
              <input
                type="password"
                id="loginPassword"
                class="form-input"
                placeholder="Enter your password"
                required
              />
            </div>

            <div class="form-options">
              <label class="checkbox-label">
                <input type="checkbox" />
                <span>Remember me</span>
              </label>
              <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="submit-btn">Sign In</button>
          </form>

          <div class="divider">
            <span>OR</span>
          </div>

          <button class="guest-btn" onclick="continueAsGuest()">
            <span>👤</span>
            <span>Continue as Guest</span>
          </button>
        </div>

        <!-- Sign Up Tab -->
        <div class="tab-content" id="signupTab">
          <form onsubmit="handleSignup(event)">
            <div class="form-group">
              <label for="signupName">Full Name</label>
              <input
                type="text"
                id="signupName"
                class="form-input"
                placeholder="Juan Dela Cruz"
                required
              />
            </div>

            <div class="form-group">
              <label for="signupEmail">Email Address</label>
              <input
                type="email"
                id="signupEmail"
                class="form-input"
                placeholder="you@example.com"
                required
              />
            </div>

            <div class="form-group">
              <label for="signupPhone">Phone Number</label>
              <input
                type="tel"
                id="signupPhone"
                class="form-input"
                placeholder="+63 912 345 6789"
                required
              />
            </div>

            <div class="form-group">
              <label for="signupPassword">Password</label>
              <input
                type="password"
                id="signupPassword"
                class="form-input"
                placeholder="Create a strong password"
                required
              />
            </div>

            <div class="form-options">
              <label class="checkbox-label">
                <input type="checkbox" required />
                <span>I agree to the Terms & Conditions</span>
              </label>
            </div>

            <button type="submit" class="submit-btn">Create Account</button>
          </form>

          <div class="divider">
            <span>OR</span>
          </div>

          <button class="guest-btn" onclick="continueAsGuest()">
            <span>👤</span>
            <span>Continue as Guest</span>
          </button>
        </div>
      </div>
    </div>

    <script>
      // Switch between login and signup tabs
      function switchTab(tab) {
        const loginTab = document.getElementById("loginTab");
        const signupTab = document.getElementById("signupTab");
        const buttons = document.querySelectorAll(".tab-btn");

        if (tab === "login") {
          loginTab.classList.add("active");
          signupTab.classList.remove("active");
          buttons[0].classList.add("active");
          buttons[1].classList.remove("active");
        } else {
          signupTab.classList.add("active");
          loginTab.classList.remove("active");
          buttons[1].classList.add("active");
          buttons[0].classList.remove("active");
        }
      }

      // Handle login form submission
      function handleLogin(event) {
        event.preventDefault();

        const email = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPassword").value;

        // Here you would normally send data to your backend
        console.log("Login attempt:", { email, password });

        // For now, simulate successful login and redirect
        // In production, wait for backend response
        localStorage.setItem("userLoggedIn", "true");
        localStorage.setItem("userEmail", email);

        // Redirect to main app
        window.location.href = "index.html";
      }

      // Handle signup form submission
      function handleSignup(event) {
        event.preventDefault();

        const name = document.getElementById("signupName").value;
        const email = document.getElementById("signupEmail").value;
        const phone = document.getElementById("signupPhone").value;
        const password = document.getElementById("signupPassword").value;

        // Here you would normally send data to your backend
        console.log("Signup attempt:", { name, email, phone, password });

        // Show success message and switch to login
        document.getElementById("successMessage").classList.add("show");
        switchTab("login");

        // Prefill email in login form
        document.getElementById("loginEmail").value = email;

        // Hide success message after 5 seconds
        setTimeout(() => {
          document.getElementById("successMessage").classList.remove("show");
        }, 5000);
      }

      // Continue as guest
      function continueAsGuest() {
        localStorage.setItem("userLoggedIn", "false");
        localStorage.setItem("isGuest", "true");

        // Redirect to main app
        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
